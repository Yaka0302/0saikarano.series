
</head>
<body>
  <div id="app">
    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <button id="muteBtn" aria-label="おとを きる">🔊</button>

    <section id="startScreen" class="screen active">
      <div class="card">
        <div class="stars">🎈</div>
        <h1>ふうせん<br>おんがくあそび</h1>
        <p>0さいから、おうちのひとと<br>いっしょに たのしめます。</p>
        <div class="notice small">
          ⚠️ かならず おとなのひとと いっしょに あそんでください。<br>
          ふうせんが われたら、ちいさなかけらを すぐに かたづけて、くちや かおの ちかくに おかないでください。
        </div>
        
<div style="margin:12px 0">
<label for="childName"><strong>あかちゃんの なまえ</strong></label><br>
<input id="childName" type="text" placeholder="〇〇ちゃん" style="font-size:1.1em;padding:8px;border-radius:8px;border:1px solid #ccc;max-width:220px;">
</div>
<p style="font-size:.95em;opacity:.8;">🎶 C4くらいの やさしい メリーふうBGMが ながれます</p>
<button id="startBtn" class="primary">はじめる</button>
      </div>
    </section>

    <section id="playScreen" class="screen">
      <div class="stage">
        <div class="instruction">
          <h2 id="stepTitle">こんにちは</h2>
          <p id="stepText">ふうせんを やさしく みせてね</p>
        </div>

        <div class="balloon-area">
          <div id="balloon" class="balloon float" aria-hidden="true"></div>
          <div class="string" aria-hidden="true"></div>
        </div>

        <div class="progress-wrap" aria-label="すすみぐあい">
          <div id="progress"></div>
        </div>
      </div>
    </section>

    <section id="endScreen" class="screen">
      <div class="card">
        <div class="stars">🌙🎈</div>
        <h2>おしまい</h2>
        <p>たのしかったね。<br>あかちゃんを ぎゅっと だっこして おわりましょう。</p>
        <div class="notice small">
          ⚠️ あそびおわった ふうせんは、あかちゃんの てが とどかない ところに かたづけてください。
        </div>
        <button id="againBtn" class="primary">もういちど</button>
      </div>
    </section>
  </div>
